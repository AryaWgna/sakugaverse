<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SakugaVerse — 作画ヴァース | All-in-One Anime Hub</title>
  <meta name="description" content="All-in-one anime super-app powered by Sakuga VFX: Watchlist tracker, 3D Anime Gacha Picker, Shonen Training Arc Pomodoro, 3D Holo Power Card Forge, and Otaku Quiz Arena.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%238f8df7' stroke='%231d1a4a' stroke-width='5'/%3E%3Cpath d='M34 12L18 35h13l-3 17 18-24H33l1-16z' fill='%23ff5fa8' stroke='%231d1a4a' stroke-width='3.5' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    try {
      const s = JSON.parse(localStorage.getItem('sakugaverse_state_v1') || '{}');
      if (s.darkMode) document.documentElement.classList.add('boot-dark');
      if (s.awakening) document.documentElement.classList.add('boot-awaken');
    } catch {}
  </script>
</head>
<body>
  <!-- Anime Manga Boot Intro Overlay -->
  <div class="boot-overlay" id="sakuga-boot" role="presentation">
    <div class="boot-speedlines" aria-hidden="true"></div>
    <div class="boot-flash" aria-hidden="true"></div>
    <div class="boot-stage">
      <div class="boot-sfx">ドン!</div>
      <div class="boot-katakana">作画ヴァース</div>
      <div class="boot-logo">SAKUGA<span>VERSE</span></div>
      <div class="boot-bar-wrap">
        <div class="boot-bar-fill"></div>
      </div>
      <div class="boot-sub">INITIALIZING ANIME HUB · 5 MODULES</div>
    </div>
    <button type="button" class="boot-skip" id="boot-skip">SKIP ⏭</button>
  </div>

  <div class="manga-bg" aria-hidden="true"></div>

  <div class="app-shell">
    <!-- Top Masthead -->
    <header class="masthead">
      <div class="brand-block">
        <div class="brand-badge">作画ヴァース · V2</div>
        <div class="brand-row">
          <h1 class="brand-title">SAKUGA<span>VERSE</span></h1>
          <sakuga-tooltip id="brand-tooltip" text="Powered by Sakuga VFX"></sakuga-tooltip>
        </div>
        <p class="brand-sub" data-i18n="tagline"></p>
      </div>

      <div class="hub-controls">
        <!-- Clickable Otaku Rank Pill -> Opens Passport & Achievements Modal -->
        <button type="button" class="rank-pill" id="rank-pill" title="Otaku Passport & Achievements">
          <div class="rank-top">
            <span class="rank-lvl" id="rank-lvl">LV.1</span>
            <span class="rank-name" id="rank-name">Genin</span>
            <span class="rank-exp" id="rank-exp">0 / 100 EXP</span>
          </div>
          <div class="rank-bar-track">
            <div class="rank-bar-fill" id="rank-bar-fill" style="width: 0%"></div>
          </div>
        </button>

        <!-- Language Switcher -->
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="id">ID</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="jp">日本語</button>
        </div>

        <!-- Dark Midnight Mode Quick Button -->
        <button type="button" class="icon-pill" id="dark-mode-btn" aria-label="Toggle Midnight Dark Mode" title="Midnight Manga Dark Mode">🌙</button>

        <!-- Awakening Mode Toggle -->
        <div class="awaken-wrap">
          <span class="awaken-label" data-i18n="awakening">Awakening</span>
          <sakuga-toggle id="awakening-toggle" label="Awakening Mode"></sakuga-toggle>
        </div>
      </div>
    </header>

    <!-- Primary Sakuga Navigation Tabs -->
    <nav class="main-nav" aria-label="Primary sections">
      <div id="main-tabs-host" class="tabs-host"></div>
    </nav>

    <!-- Main Module Panels -->
    <main class="panels">
      <section id="panel-watchlist" class="module-panel" role="tabpanel" aria-label="Watchlist"></section>
      <section id="panel-gacha" class="module-panel" role="tabpanel" aria-label="Gacha" hidden></section>
      <section id="panel-training" class="module-panel" role="tabpanel" aria-label="Training Arc" hidden></section>
      <section id="panel-cardforge" class="module-panel" role="tabpanel" aria-label="Card Forge" hidden></section>
      <section id="panel-quiz" class="module-panel" role="tabpanel" aria-label="Otaku Arena" hidden></section>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>
        <strong>SakugaVerse</strong> — <span data-i18n="footerCredit"></span>
      </p>
      <div class="footer-stats" id="footer-stats"></div>
    </footer>
  </div>

  <!-- Sticky Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="Mobile quick navigation"></nav>

  <!-- Global Modal Host (Otaku Passport & Watchlist Detail) -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-dialog" id="modal-dialog" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Global Fixed Toast (duration is in seconds!) -->
  <div class="toast-dock">
    <sakuga-toast id="global-toast" duration="2.6"></sakuga-toast>
  </div>

  <!-- Plain scripts for Sakuga VFX Web Components (must not be ES modules) -->
  <script src="/sakuga-vfx/button.js"></script>
  <script src="/sakuga-vfx/toggle.js"></script>
  <script src="/sakuga-vfx/slider.js"></script>
  <script src="/sakuga-vfx/checkbox.js"></script>
  <script src="/sakuga-vfx/radio.js"></script>
  <script src="/sakuga-vfx/input.js"></script>
  <script src="/sakuga-vfx/tabs.js"></script>
  <script src="/sakuga-vfx/progress.js"></script>
  <script src="/sakuga-vfx/rating.js"></script>
  <script src="/sakuga-vfx/toast.js"></script>
  <script src="/sakuga-vfx/tooltip.js"></script>

  <!-- Main App Entry (Vite ES Module) -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
